name: Site checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          git ls-files -z '*.js' '*.mjs' | xargs -0 -n1 node --check

      - name: Check site links and accessibility contracts
        run: python3 scripts/check-site.py
