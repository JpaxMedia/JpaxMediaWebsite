<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Project Brief Received | JPAX Media</title>
  <meta name="description" content="Your project brief has been sent to Julian at JPAX Media.">
  <meta name="theme-color" content="#06080F">
  <link rel="icon" type="image/png" href="/jpaxmedialogoOFFICIALFINALwhite.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --dark: #06080f;
      --green: #4ade80;
      --text: #e2e8f0;
      --soft: #94a3b8;
      --display: "Chakra Petch", system-ui, sans-serif;
      --body: "IBM Plex Sans", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 50% 38%, rgba(74, 222, 128, 0.14), transparent 0 27%),
        linear-gradient(rgba(74, 222, 128, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(74, 222, 128, 0.06) 1px, transparent 1px),
        var(--dark);
      background-size: auto, 68px 68px, 68px 68px, auto;
      color: var(--text);
      font-family: var(--body);
      text-align: center;
    }
    main { width: min(720px, 100%); }
    .logo {
      width: 82px;
      height: auto;
      margin-bottom: 26px;
      filter: drop-shadow(0 0 22px rgba(74, 222, 128, 0.25));
    }
    .kicker {
      margin: 0 0 14px;
      color: var(--green);
      font-family: var(--display);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      color: #f8fafc;
      font-family: var(--display);
      font-size: clamp(2.2rem, 7vw, 4.8rem);
      line-height: 1;
      text-wrap: balance;
    }
    .lead {
      max-width: 590px;
      margin: 24px auto 0;
      color: var(--soft);
      font-size: clamp(1rem, 2vw, 1.18rem);
      line-height: 1.7;
    }
    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 34px;
    }
    .button {
      display: inline-flex;
      align-items: center;
      min-height: 48px;
      padding: 0 22px;
      border: 1px solid var(--green);
      border-radius: 999px;
      background: var(--green);
      color: #04110a;
      font-family: var(--display);
      font-weight: 700;
      text-decoration: none;
    }
    .button.secondary { background: transparent; color: var(--text); }
    .button:focus-visible { outline: 3px solid #f8fafc; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/jpaxmedialogoOFFICIALFINALwhite.png" alt="JPAX Media">
    <p class="kicker">Project brief received</p>
    <h1>It&rsquo;s with Julian.</h1>
    <p class="lead">Your details were sent successfully. Julian reviews every brief personally and will follow up if the project is a fit.</p>
    <div class="actions">
      <a class="button" href="/">Return home</a>
      <a class="button secondary" href="/work">See the work</a>
    </div>
  </main>
  <script src="/assets/js/jpax-site-intelligence.js" defer></script>
</body>
</html>
